spring.application.name=personal-finance-manager
server.port=${PORT:8080}

# Database: H2 in-memory by default, overridable through env vars
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:mem:pfm;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${DB_USERNAME:${DB_USER:sa}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

jwt.secret=${JWT_SECRET:QmFiWUtpZXRIdWRkeV9KV1RfU2VjcmV0X0tleV8yMDI2X1N1cGVyU3Ryb25nMTIzNDU2Nzg5MA==}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Application cookie secure flag (configurable via app.cookie.secure, defaults to false locally)
app.cookie.secure=${APP_COOKIE_SECURE:${COOKIE_SECURE:false}}

# Session cookie hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${app.cookie.secure:false}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# Timezone used to decide what "today" and "future" mean
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
