spring.application.name=personal-finance-manager
server.port=${PORT:8080}

# Database: H2 in-memory by default, overridable through env vars
spring.datasource.url=${DB_URL:jdbc:h2:mem:pfm;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.profiles.active=local
# Session cookie hardening (set COOKIE_SECURE=true on Render)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# Timezone used to decide what "today" and "future" mean
app.timezone=${APP_TIMEZONE:Asia/Kolkata}